# 客户端版本目录的父目录；按版本号选取最新目录。
dll_root: 'D:/Program Files (x86)/Tencent/QQLive'
# 最新版本目录中的客户端下载代理 DLL 文件名。
dll_name: 'DownloadProxy.dll'
# 已验证 DLL 的 SHA-256；内容变化后自动隔离验收，通过后更新，接口不兼容时需重新分析。
dll_sha256: 'be3518e93d334615b72de220876eeba1992765b6307f4786392e1503c3890175'
# 以下接口位置基于现有客户端分析；升级后若不兼容，需重新分析并修改。
# 支持的 HVN 缓存文件头版本，用于读取前校验。
cache_version: 2
# 客户端缓存上下文对象的缓冲区大小，单位为字节。
context_size: 80
# 缓存上下文中加密对象指针的字节偏移。
crypto_pointer_offset: 24
# 加密对象虚函数表中还原函数的字节偏移。
decrypt_vtable_offset: 16
# 以下为对应 DLL 中各函数相对于模块基址的地址（RVA）。
rva:
  # 缓存上下文构造函数的 RVA。
  construct: 0x3534b0
  # 缓存上下文初始化函数的 RVA。
  initialize: 0x353500
  # 缓存文件头校验函数的 RVA。
  checksum: 0x354600
  # 缓存上下文销毁函数的 RVA。
  destroy: 0x3534e0
