<h1>B 站任务进度</h1><p class="intro" id="connection"></p><div id="storage" class="notice" hidden></div>
<div class="toolbar"><input type="search" id="search" placeholder="搜索任务、标题、BV/ss/ep 号、分 P 或错误原因" aria-label="搜索日志"><label><input type="checkbox" id="errors"> 只看失败、中断和提示</label><a class="export" id="export" href="/snapshot">导出 HTML</a></div>
<main id="runs"></main><script id="download-log-data" type="application/json"><!--DATA--></script>
<script>
const live = __LIVE__;
const clientId = __CLIENT_ID__;
const labels = __LABELS__;

// 创建 tag 元素，text 为可选纯文本，className 为可选样式类；返回元素，避免执行日志中的 HTML。

// 将字节速度 value 转为十进制 MB/s 文本；未知值返回破折号。
function speed(value) { return typeof value === 'number' && Number.isFinite(value) ? (value/1000000).toFixed(2)+' MB/s' : '—'; }
// 将字节数 value 转为十进制 MB 文本；未知值返回破折号。
function bytes(value) { return typeof value === 'number' && Number.isFinite(value) ? (value/1000000).toFixed(2)+' MB' : '—'; }
// 判断 entry 是否有可用成品；带提示的完成项必须具有路径；返回布尔值。
function successful(entry) { return ['completed','reused'].includes(entry.status) || (entry.status === 'warning' && Boolean(entry.path)); }

function groupStatus(group) {

// 为 group 分别生成下载版本和拼接进度条；返回阶段容器。
function groupProgress(group) {
  const result = node('div');

// 汇总 group 下载均速：字节求和、有效传输区间取并集，排除排队并避免并发区间重复计时；返回字节/秒或 null。
function groupSpeed(group) {
  const downloads = group.children.filter(function(entry) { return entry.kind === '下载' && entry.metric_intervals && entry.metric_intervals.length; });
  const intervals = downloads.flatMap(function(entry) { return entry.metric_intervals; }).slice().sort(function(a,b) { return a[0]-b[0]; });

// 为可选 ISO 开始 start 和结束 finish 创建耗时元素；运行中由统一时钟刷新；返回元素。
function elapsedElement(start, finish) { const result = node('span','--:--:--','duration'); result.dataset.started = start || ''; result.dataset.finished = finish || ''; return result; }
// 根据 group 父任务或实际子项取得起止时间；返回两项字符串数组。
function groupTimes(group) {

  const finish = group.children.every(function(entry) { return terminal.has(entry.status); }) ? group.children.map(function(entry) { return entry.finished; }).filter(Boolean).sort().at(-1) : '';

// 按服务器采样时间及本页单调时钟刷新耗时；离线、结束或断线时冻结；无参数及返回值。
function updateTimes() {

// 判断 entry 是否同时匹配 query 和异常开关；返回布尔值。
function matches(entry, query) { return (!errors.checked || attention.has(entry.status)) && [entry.title,entry.task,entry.part,entry.detail,entry.quality].join(' ').toLowerCase().includes(query); }

// 将 entry 行插入 body 并保留异常原因摘要；run/group 是归属信息，host 是下方详情容器；无返回值。
function appendEntry(body, run, group, entry, host) {

// 渲染 data 内存快照；force 表示本地筛选或折叠，保留运行、任务展开状态及滚动位置；无返回值。

      if(group.parent && group.parent.detail && attention.has(group.parent.status)) title.append(node('small',group.parent.detail)); const state = node('td'); state.append(badge(groupStatus(group),group.children.some(function(entry) { return entry.status === 'failed'; }) && groupStatus(group) === 'warning' ? '部分失败' : null));

      if(open) ['下载','合并'].forEach(function(kind) { const children = entries.filter(function(entry) { return entry.kind === kind; }); if(!children.length) return; const phase = node('tr',undefined,'phase-row'), cell = node('td',kind); cell.colSpan = 7; phase.append(cell); body.append(phase); children.forEach(function(entry) { appendEntry(body,run,group,entry,detail); if(selectedEntries.get(run.id) === entry.id || (!selectedEntries.has(run.id) && !chosen)) chosen = [group,entry]; }); });
      if(parentMatches && !group.children.length) { const reason = node('tr'), message = node('td',group.parent.detail || '任务尚未创建下载或合并项'); message.colSpan = 7; reason.append(message); body.append(reason); }
    });
    if(!body.children.length) { const row = node('tr'), message = node('td','暂无匹配活动','empty'); message.colSpan = 7; row.append(message); body.append(row); }
    table.append(body); wrapper.append(table); content.append(wrapper,detail); section.append(content); fragment.append(section); if(chosen) showDetail(run,chosen[0],chosen[1],detail);
  }); runs.replaceChildren(fragment);
  const storage = document.getElementById('storage'); storage.hidden = !data.storage_error; storage.textContent = data.storage_error ? '日志尚未保存到磁盘，下载和合并继续：'+data.storage_error : ''; updateTimes(); window.scrollTo(0,position);
}
// 从本机内存接口获取并显示快照，最终状态显示后逐页确认；断线时冻结最后状态；无参数及返回值。
async function refresh() {
  try { const response = await fetch('/api/state?client_id='+encodeURIComponent(clientId),{cache:'no-store'}); if(!response.ok) throw new Error('HTTP '+response.status); const data = await response.json(); receivedAt = performance.now(); connected = true; render(data);
    connection.textContent = data.closed ? '运行已结束 · 当前为最终状态' : '实时连接 · 每 '+interval/1000+' 秒更新 · 平均速度 MB/s · 日期 YYYY:MM:DD · 耗时 HH:MM:SS';
    if(!data.closed) timer = setTimeout(refresh,interval); else { clearInterval(clockTimer); if(clientId) { const query = new URLSearchParams({client_id:clientId,run_id:data.runs.at(-1).id,revision:String(data.revision)}); const receipt = await fetch('/api/ack?'+query,{cache:'no-store'}); if(!receipt.ok) throw new Error('HTTP '+receipt.status); } }
  } catch(error) { connected = false; clearInterval(clockTimer); updateTimes(); if(!currentData.closed) connection.textContent = '连接已断开 · 以下为最后接收的数据，最终状态请查看程序保存的离线快照'; }
}
search.addEventListener('input',function() { render(currentData,true); }); errors.addEventListener('change',function() { render(currentData,true); });
const initial = JSON.parse(document.getElementById('download-log-data').textContent); render(initial); document.getElementById('export').hidden = !live;
if(live) { clockTimer = setInterval(updateTimes,1000); refresh(); } else connection.textContent = '离线快照 · 已内嵌全部数据 · 耗时固定为导出时的状态';
