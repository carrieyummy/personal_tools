<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>爱奇艺下载与解析进度</title>
<style>
:root{font-family:system-ui,"Microsoft YaHei",sans-serif;color:#1d2939;background:#f3f6fa}*{box-sizing:border-box}body{margin:0;padding:28px}main{max-width:1560px;margin:auto}h1{font-size:25px;margin:0 0 8px}p{margin:7px 0}.muted,small{color:#667085;font-size:13px}.top{display:flex;align-items:center;justify-content:space-between;gap:20px}button,a{color:#2268c9}button,select,input,.export{font:inherit;padding:9px 12px;background:white;border:1px solid #d0d5dd;border-radius:7px}.export{text-decoration:none;white-space:nowrap}.metrics{display:flex;flex-wrap:wrap;gap:12px;margin:22px 0}.metric{padding:14px 21px;border:1px solid #e4e7ec;border-radius:10px;background:white;min-width:130px}.metric b{display:block;font-size:25px}.tools{display:flex;gap:12px;margin:18px 0}.tools input{flex:1;max-width:500px}.run,.series{background:white;border:1px solid #dce2ea;border-radius:10px;margin:14px 0}.run>summary{padding:17px 20px;font-weight:600}.series{margin:14px}.series>summary{padding:16px;cursor:pointer;display:list-item}.series>summary strong{margin-right:16px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:1040px}th,td{text-align:left;padding:14px 16px;border-top:1px solid #eef1f5;vertical-align:top}th{font-size:13px;color:#667085;background:#f9fafb}td:nth-child(1){width:24%}td:nth-child(3),td:nth-child(4){width:25%}small{display:block;margin-top:5px;max-width:400px;overflow-wrap:anywhere}progress{display:block;width:100%;height:12px;margin-top:8px;accent-color:#287be0}.badge{display:inline-block;border-radius:20px;background:#f1f3f7;padding:4px 9px;font-size:12px;white-space:nowrap}.completed,.reused{background:#e7f6ee;color:#167347}.failed{background:#ffeded;color:#bc2929}.interrupted,.warning{background:#fff4d8;color:#8d6000}.running{background:#eaf2ff;color:#2464bc}.detail{margin:10px 0;color:#667085;font-size:12px}.detail p{overflow-wrap:anywhere}.alert{padding:12px;border-radius:8px;background:#fff4d8;margin:12px 0}.empty{padding:24px;color:#667085}.stage{font-size:13px}.number{font-variant-numeric:tabular-nums}a{margin-right:12px}
</style>
<main>
<div class="top"><div><h1>爱奇艺下载与解析进度</h1><p id="connection" class="muted"></p></div><div><a class="export" href="/export" id="export">导出当前报告</a><button type="button" id="stop-service" hidden>停止服务</button></div></div>
<div id="storage" class="alert" hidden></div><div class="metrics" id="metrics"></div>
<div class="tools"><input id="search" placeholder="搜索电视剧、集数或错误"><select id="filter"><option value="">全部状态</option><option value="active">进行中</option><option value="attention">失败与中断</option><option value="completed">已完成与复用</option></select></div>
<div id="runs"></div></main>
<script id="playback-log-data" type="application/json">__DATA__</script>
<script>
'use strict';
const live=__LIVE__,interval=__INTERVAL__,terminal=new Set(['completed','reused','failed','interrupted','skipped','cancelled']),opened=new Map();
const labels={pending:'等待',discovering:'解析中',ready:'已展开',running:'进行中',awaiting_stop:'等待停止',completed:'已完成',reused:'已复用',failed:'失败',interrupted:'已中断',skipped:'未执行',cancelled:'已取消',warning:'部分失败'};
const stages={resetting_download:'清理旧断点',validating_manifest:'校验下载清单',waiting_source:'等待播放资源接口',resolving_source:'解析视频与音轨',authorizing:'检查播放授权',checking_reuse:'校验既有成品',downloading:'下载音视频',waiting_download:'等待下载名额',waiting_queue:'等待队列容量',waiting_processing:'等待处理',processing:'等待处理阶段',decrypting:'授权还原',restoring_audio:'重建独立音轨',muxing:'无损封装',verifying:'全片解码验证',checking:'校验媒体及摘要',publishing:'保存与复制校验',completed:'已完成'};
const pendingRetries=new Set();
const stopButton=document.getElementById('stop-service');
let state=JSON.parse(document.getElementById('playback-log-data').textContent),connected=true,stopping=false,timer;
/** 创建标签 tag，text 为可选纯文本，cls 为可选样式；返回 DOM 元素。 */
function node(tag,text,cls){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e;}
/** 将数值 n 格式化为字节数；未知返回占位符。 */
function bytes(n){if(typeof n!=='number')return '—';for(const [unit,size] of [['GB',1024**3],['MB',1024**2],['KB',1024]])if(n>=size)return (n/size).toFixed(2)+' '+unit;return n+' B';}
/** 将秒数 n 格式化为持续时间；未知返回占位符。 */
function duration(n){if(typeof n!=='number'||!Number.isFinite(n))return '—';n=Math.max(0,Math.floor(n));return [Math.floor(n/3600),Math.floor(n/60)%60,n%60].map(v=>String(v).padStart(2,'0')).join(':');}
/** 为状态 value 创建标签；返回 span。 */
function badge(value){return node('span',labels[value]||value,'badge '+value);}
/** 为 key 创建保留展开状态的区域；open 为默认状态，返回 details。 */
function fold(key,open,cls){const e=node('details',undefined,cls);e.open=opened.has(key)?opened.get(key):open;e.addEventListener('toggle',()=>{if(e.isConnected)opened.set(key,e.open);});return e;}
/** 为阶段 phase 创建实际进度、验证设备及速度节点；返回表格单元。 */
function meter(phase){const cell=node('td'),value=phase.progress;cell.append(node('div',stages[phase.stage]||labels[phase.status]||'等待','stage'));if(phase.device)cell.append(node('small','验证设备：'+phase.device.toUpperCase()));if(typeof value==='number')cell.append(node('small',value.toFixed(1)+'%','number'));if(phase.status==='running'){const bar=node('progress');bar.max=100;if(typeof value==='number')bar.value=value;cell.append(bar);}if(typeof phase.current_bytes==='number')cell.append(node('small',bytes(phase.current_bytes)+' / '+bytes(phase.total_bytes),'number'));if(typeof phase.speed_bps==='number')cell.append(node('small',bytes(phase.speed_bps)+'/s · 剩余 '+duration(phase.eta_seconds),'number'));return cell;}
/** 检查条目 entry 是否匹配搜索及状态筛选；返回布尔值。 */
function matches(entry){const query=document.getElementById('search').value.toLowerCase(),filter=document.getElementById('filter').value;const text=[entry.series_title,entry.title,'第'+entry.episode+'集',entry.detail,entry.error].join(' ').toLowerCase();return (!query||text.includes(query))&&(!filter||(filter==='active'?!terminal.has(entry.status):filter==='attention'?['failed','interrupted'].includes(entry.status):['completed','reused'].includes(entry.status)));}
/** 请求取消 kind 指定的链接或专辑 id；button 禁用以避免重复提交。 */
async function cancelTarget(kind,id,button){button.disabled=true;try{const response=await fetch('/api/cancel',{method:'POST',headers:{'Content-Type':'application/json','X-Control-Token':state.control_token},body:JSON.stringify({kind,id})});if(!response.ok)throw new Error('请求未被接受：'+response.status);button.textContent='取消请求已提交';}catch(error){button.disabled=false;alert('取消失败：'+error.message);}}
/** 创建取消 kind/id 的按钮；返回按钮，点击时不改变分组折叠状态。 */
function cancelButton(kind,id){const button=node('button','取消下载');button.type='button';button.addEventListener('click',event=>{event.preventDefault();event.stopPropagation();cancelTarget(kind,id,button);});return button;}
/** 为失败的 entry 创建单集重试按钮；点击确认后向本机服务提交当前行标识。 */
function retryButton(entry){
    const pending=entry.retry_queued||pendingRetries.has(entry.id),button=node('button',pending?'重试已排队':'清除断点并重试');
    button.type='button';
    button.disabled=!!pending;
    button.addEventListener('click',async()=>{
        if(!confirm('清除第 '+entry.episode+' 集未发布的下载缓存并重新下载？'))return;
        pendingRetries.add(entry.id);
        button.disabled=true;
        try{
            const response=await fetch('/api/retry',{method:'POST',headers:{'Content-Type':'application/json','X-Control-Token':state.control_token},body:JSON.stringify({kind:'episode',id:entry.id})});
            if(response.status===409)throw new Error('该集已排队、已取消，或批次已结束。');
            if(!response.ok)throw new Error('HTTP '+response.status);
            button.textContent='重试已排队';
        }catch(error){
            button.disabled=false;
            alert('重试失败：'+error.message);
        }finally{
            pendingRetries.delete(entry.id);
        }
    });
    return button;
}
/** 更新当前批次 latest 的连接提示和停止按钮，离线报告隐藏按钮。 */
function updateConnection(latest){
    const idle=!!latest?.awaiting_stop;
    stopButton.hidden=!(live&&!state.read_only&&connected&&!state.closed&&(idle||stopping));
    stopButton.disabled=stopping;
    document.getElementById('connection').textContent=!live?'离线报告':!connected?'连接已断开 · 保留最后状态':state.read_only?'只读快照 · 最后保存 '+state.captured_at:state.closed?'服务已停止':stopping?'正在保存报告并停止服务':idle?'任务已处理完毕 · 等待停止服务':'实时连接 · 每 '+interval/1000+' 秒刷新';
}
/** 请求停止当前已清空队列的批次服务，等待刷新显示最终状态。 */
async function stopService(){
    const run=state.runs.at(-1);
    if(stopping||!run?.awaiting_stop)return;
    stopping=true;
    updateConnection(run);
    try{
        const response=await fetch('/api/stop',{method:'POST',headers:{'Content-Type':'application/json','X-Control-Token':state.control_token},body:JSON.stringify({kind:'batch',id:run.id})});
        if(response.status===409)throw new Error('批次正在处理任务，或服务已停止。');
        if(!response.ok)throw new Error('HTTP '+response.status);
    }catch(error){
        stopping=false;
        updateConnection(state.runs.at(-1));
        alert('停止服务失败：'+error.message);
    }
}
/** 根据内存 state 渲染按电视剧分组的单集行；保留折叠状态和滚动位置，无返回值。 */
function render(){const y=window.scrollY,host=document.getElementById('runs');host.replaceChildren();const runs=state.runs.slice().reverse(),latest=runs[0],entries=latest?latest.entries:[];const metrics=document.getElementById('metrics');metrics.replaceChildren();[['本批集数',entries.length],['已完成',entries.filter(e=>e.status==='completed').length],['已复用',entries.filter(e=>e.status==='reused').length],['进行中',entries.filter(e=>!terminal.has(e.status)&&e.status!=='pending').length],['失败',entries.filter(e=>e.status==='failed').length]].forEach(([label,count])=>{const card=node('div',undefined,'metric');card.append(node('b',count),node('small',label));metrics.append(card);});updateConnection(latest);const storage=document.getElementById('storage');storage.hidden=!state.storage_error;storage.textContent=state.storage_error||'';
for(const [runIndex,run] of runs.entries()){const section=fold('run:'+run.id,runIndex===0,'run'),title=node('summary',new Date(run.started).toLocaleString()+' ');title.append(badge(live&&run.awaiting_stop?'awaiting_stop':run.status));section.append(title);if(!section.open){section.addEventListener('toggle',()=>{if(section.isConnected&&section.open)render();});host.append(section);continue;}if(['resolving','discovering','ready','interrupted'].includes(run.catalog_status))section.append(node('p',({resolving:'目录展开中，任务总数待确定',discovering:'目录展开中，已就绪任务继续下载',ready:'目录展开完成',interrupted:'目录展开已中断'}[run.catalog_status])+' · 已发现 '+(run.catalog_discovered||0)+' 集'+(run.catalog_total?' · 清单 '+run.catalog_processed+'/'+run.catalog_total:''),'empty'));if(run.catalog_errors)for(const error of run.catalog_errors)section.append(node('p','链接 '+error.index+'：'+error.error,'alert'));if(live&&runIndex===0&&!state.closed&&run.links){const pending=run.links.filter(link=>['pending','discovering','cancelled'].includes(link.status)&&(!link.album_id||link.status==='discovering'));if(pending.length){const box=fold('links:'+run.id,true,'series'),head=node('summary','待解析链接');box.append(head);for(const link of pending){const row=node('p','链接 '+link.index+' · '+link.url+' · '+(labels[link.status]||link.status));if(!state.read_only&&link.status!=='cancelled')row.append(cancelButton('link',link.id));box.append(row);}section.append(box);}}const groups=new Map();for(const entry of run.entries){if(!groups.has(entry.directory))groups.set(entry.directory,[]);groups.get(entry.directory).push(entry);}for(const [key,all] of groups){const selected=all.filter(matches);if(!selected.length)continue;const group=fold('series:'+run.id+':'+key,true,'series'),heading=node('summary');heading.append(node('strong',all[0].series_title),node('span','完成 '+all.filter(e=>['completed','reused'].includes(e.status)).length+'/'+all.length+' 集 · 失败 '+all.filter(e=>e.status==='failed').length));if(live&&runIndex===0&&!state.closed){if((run.cancelled_albums||[]).includes(key))heading.append(node('span',' · 已请求取消'));else if(!state.read_only&&(all.some(e=>!terminal.has(e.status))||run.catalog_status!=='ready'))heading.append(cancelButton('album',key));}group.append(heading);const wrap=node('div',undefined,'tablewrap'),table=node('table'),head=node('tr');['剧集 / 实际媒体','状态','下载进度','解析与保存进度','耗时'].forEach(t=>head.append(node('th',t)));table.append(head);selected.sort((a,b)=>a.episode-b.episode);for(const entry of selected){const row=node('tr'),name=node('td','第 '+entry.episode+' 集 · '+entry.title);name.append(node('small',entry.media_label||('视频排名 '+entry.quality_rank+' · 音轨排名 '+entry.audio_quality_rank)));if(entry.detail)name.append(node('small',entry.detail));const detail=fold('entry:'+entry.id,false,'detail');detail.append(node('summary','查看详情'));if(typeof entry.play_url==='string'){try{const url=new URL(entry.play_url);if(['http:','https:'].includes(url.protocol)){const p=node('p','页面链接：'),a=node('a',entry.play_url);a.href=url.href;a.target='_blank';a.rel='noopener noreferrer';p.append(a);detail.append(p);}}catch(_){}}if(entry.output)detail.append(node('p','成品：'+entry.output));if(entry.error)detail.append(node('p',entry.error));if(entry.file_url){const a=node('a','打开成品');a.href=entry.file_url;a.target='_blank';detail.append(a);}if(entry.report_url){const a=node('a','查看报告');a.href=entry.report_url;a.target='_blank';detail.append(a);}name.append(detail);const status=node('td');status.append(badge(entry.status));if(live&&connected&&runIndex===0&&state.retry_enabled&&entry.status==='failed'&&!(run.cancelled_albums||[]).includes(key))status.append(node('br'),retryButton(entry));const end=entry.finished?new Date(entry.finished):state.closed||!connected?new Date(state.captured_at):new Date();row.append(name,status,meter(entry.download),meter(entry.processing),node('td',entry.started?duration((end-new Date(entry.started))/1000):'—','number'));table.append(row);}wrap.append(table);group.append(wrap);section.append(group);}host.append(section);}if(!host.children.length)host.append(node('p','没有匹配的剧集。','empty'));if(!live)document.getElementById('export').hidden=true;window.scrollTo(0,y);}
/** 获取一次实时状态，终态渲染后确认版本；失败保留最后内容，无返回值。 */
async function refresh(){try{let response=await fetch(state.read_only?'/api/state':'/api/state?current=1',{cache:'no-store'});if(!response.ok)throw new Error('HTTP '+response.status);let next=await response.json();if(!state.read_only){if(next.runs[0]?.id===state.runs.at(-1)?.id)next.runs=state.runs.slice(0,-1).concat(next.runs);else{response=await fetch('/api/state',{cache:'no-store'});if(!response.ok)throw new Error('HTTP '+response.status);next=await response.json();}}state=next;connected=true;render();if(state.closed){await fetch('/api/ack?revision='+encodeURIComponent(state.revision),{cache:'no-store'});return;}}catch(_){connected=false;render();}timer=setTimeout(refresh,interval);}
stopButton.addEventListener('click',stopService);document.getElementById('search').addEventListener('input',render);document.getElementById('filter').addEventListener('change',render);render();if(live){if(state.closed)refresh();else timer=setTimeout(refresh,interval);}
</script></html>
