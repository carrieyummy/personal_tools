<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>爱奇艺下载与解析进度</title>
<style>
:root{font-family:system-ui,"Microsoft YaHei",sans-serif;color:#1d2939;background:#f3f6fa}*{box-sizing:border-box}body{margin:0;padding:28px}main{max-width:1560px;margin:auto}h1{font-size:25px;margin:0 0 8px}p{margin:7px 0}.muted,small{color:#667085;font-size:13px}.top{display:flex;align-items:center;justify-content:space-between;gap:20px}button,a{color:#2268c9}button,select,input,.export{font:inherit;padding:9px 12px;background:white;border:1px solid #d0d5dd;border-radius:7px}.export{text-decoration:none;white-space:nowrap}.metrics{display:flex;flex-wrap:wrap;gap:12px;margin:22px 0}.metric{padding:14px 21px;border:1px solid #e4e7ec;border-radius:10px;background:white;min-width:130px}.metric b{display:block;font-size:25px}.tools{display:flex;gap:12px;margin:18px 0}.tools input{flex:1;max-width:500px}.run,.series{background:white;border:1px solid #dce2ea;border-radius:10px;margin:14px 0}.run>summary{padding:17px 20px;font-weight:600}.series{margin:14px}.series>summary{padding:16px;cursor:pointer;display:list-item}.series>summary strong{margin-right:16px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:1040px}th,td{text-align:left;padding:14px 16px;border-top:1px solid #eef1f5;vertical-align:top}th{font-size:13px;color:#667085;background:#f9fafb}td:nth-child(1){width:24%}td:nth-child(3),td:nth-child(4){width:25%}small{display:block;margin-top:5px;max-width:400px;overflow-wrap:anywhere}progress{display:block;width:100%;height:12px;margin-top:8px;accent-color:#287be0}.badge{display:inline-block;border-radius:20px;background:#f1f3f7;padding:4px 9px;font-size:12px;white-space:nowrap}.completed,.reused{background:#e7f6ee;color:#167347}.failed{background:#ffeded;color:#bc2929}.interrupted,.warning{background:#fff4d8;color:#8d6000}.running{background:#eaf2ff;color:#2464bc}.detail{margin:10px 0;color:#667085;font-size:12px}.detail p{overflow-wrap:anywhere}.alert{padding:12px;border-radius:8px;background:#fff4d8;margin:12px 0}.empty{padding:24px;color:#667085}.stage{font-size:13px}.number{font-variant-numeric:tabular-nums}a{margin-right:12px}
</style>
<main>
<div class="top"><div><h1>爱奇艺下载与解析进度</h1><p id="connection" class="muted"></p></div><a class="export" href="/export" id="export">导出当前报告</a></div>
<div id="storage" class="alert" hidden></div><div class="metrics" id="metrics"></div>
<div class="tools"><input id="search" placeholder="搜索电视剧、集数或错误"><select id="filter"><option value="">全部状态</option><option value="active">进行中</option><option value="attention">失败与中断</option><option value="completed">已完成与复用</option></select></div>
<div id="runs"></div></main>
<script id="playback-log-data" type="application/json">__DATA__</script>
<script>
'use strict';
const live=__LIVE__,interval=__INTERVAL__,terminal=new Set(['completed','reused','failed','interrupted','skipped']),opened=new Map();
const labels={pending:'等待',running:'进行中',completed:'已完成',reused:'已复用',failed:'失败',interrupted:'已中断',skipped:'未执行',warning:'部分失败'};
const stages={waiting_source:'等待播放资源接口',resolving_source:'解析视频与音轨',authorizing:'检查播放授权',checking_reuse:'校验既有成品',downloading:'下载音视频',waiting_download:'等待下载名额',waiting_queue:'等待队列容量',waiting_processing:'等待处理',processing:'等待处理阶段',decrypting:'授权还原',restoring_audio:'重建独立音轨',muxing:'无损封装',verifying:'全片解码验证',checking:'校验媒体及摘要',publishing:'保存与复制校验',completed:'已完成'};
let state=JSON.parse(document.getElementById('playback-log-data').textContent),connected=true,timer;
/** 创建标签 tag，text 为可选纯文本，cls 为可选样式；返回 DOM 元素。 */
function node(tag,text,cls){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e;}
/** 将数值 n 格式化为字节数；未知返回占位符。 */
function bytes(n){if(typeof n!=='number')return '—';for(const [unit,size] of [['GB',1024**3],['MB',1024**2],['KB',1024]])if(n>=size)return (n/size).toFixed(2)+' '+unit;return n+' B';}
/** 将秒数 n 格式化为持续时间；未知返回占位符。 */
function duration(n){if(typeof n!=='number'||!Number.isFinite(n))return '—';n=Math.max(0,Math.floor(n));return [Math.floor(n/3600),Math.floor(n/60)%60,n%60].map(v=>String(v).padStart(2,'0')).join(':');}
/** 为状态 value 创建标签；返回 span。 */
function badge(value){return node('span',labels[value]||value,'badge '+value);}
/** 为 key 创建保留展开状态的区域；open 为默认状态，返回 details。 */
function fold(key,open,cls){const e=node('details',undefined,cls);e.open=opened.has(key)?opened.get(key):open;e.addEventListener('toggle',()=>{if(e.isConnected)opened.set(key,e.open);});return e;}
/** 为阶段 phase 创建实际进度、验证设备及速度节点；返回表格单元。 */
function meter(phase){const cell=node('td'),value=phase.progress;cell.append(node('div',stages[phase.stage]||labels[phase.status]||'等待','stage'));if(phase.device)cell.append(node('small','验证设备：'+phase.device.toUpperCase()));if(typeof value==='number')cell.append(node('small',value.toFixed(1)+'%','number'));if(phase.status==='running'){const bar=node('progress');bar.max=100;if(typeof value==='number')bar.value=value;cell.append(bar);}if(typeof phase.current_bytes==='number')cell.append(node('small',bytes(phase.current_bytes)+' / '+bytes(phase.total_bytes),'number'));if(typeof phase.speed_bps==='number')cell.append(node('small',bytes(phase.speed_bps)+'/s · 剩余 '+duration(phase.eta_seconds),'number'));return cell;}
/** 检查条目 entry 是否匹配搜索及状态筛选；返回布尔值。 */
function matches(entry){const query=document.getElementById('search').value.toLowerCase(),filter=document.getElementById('filter').value;const text=[entry.series_title,entry.title,'第'+entry.episode+'集',entry.detail,entry.error].join(' ').toLowerCase();return (!query||text.includes(query))&&(!filter||(filter==='active'?!terminal.has(entry.status):filter==='attention'?['failed','interrupted'].includes(entry.status):['completed','reused'].includes(entry.status)));}
/** 根据内存 state 渲染按电视剧分组的单集行；保留折叠状态和滚动位置，无返回值。 */
function render(){const y=window.scrollY,host=document.getElementById('runs');host.replaceChildren();const runs=state.runs.slice().reverse(),latest=runs[0],entries=latest?latest.entries:[];const metrics=document.getElementById('metrics');metrics.replaceChildren();[['本批集数',entries.length],['已完成',entries.filter(e=>e.status==='completed').length],['已复用',entries.filter(e=>e.status==='reused').length],['进行中',entries.filter(e=>!terminal.has(e.status)&&e.status!=='pending').length],['失败',entries.filter(e=>e.status==='failed').length]].forEach(([label,count])=>{const card=node('div',undefined,'metric');card.append(node('b',count),node('small',label));metrics.append(card);});document.getElementById('connection').textContent=!live?'离线报告':!connected?'连接已断开 · 保留最后状态':state.closed?'本批次已结束':'实时连接 · 每 '+interval/1000+' 秒刷新';const storage=document.getElementById('storage');storage.hidden=!state.storage_error;storage.textContent=state.storage_error||'';
for(const [runIndex,run] of runs.entries()){const section=fold('run:'+run.id,runIndex===0,'run'),title=node('summary',new Date(run.started).toLocaleString()+' ');title.append(badge(run.status));section.append(title);if(['resolving','discovering','ready','interrupted'].includes(run.catalog_status))section.append(node('p',({resolving:'目录展开中，任务总数待确定',discovering:'目录展开中，已就绪任务继续下载',ready:'目录展开完成',interrupted:'目录展开已中断'}[run.catalog_status])+' · 已发现 '+(run.catalog_discovered||0)+' 集'+(run.catalog_total?' · 清单 '+run.catalog_processed+'/'+run.catalog_total:''),'empty'));if(run.catalog_errors)for(const error of run.catalog_errors)section.append(node('p','链接 '+error.index+'：'+error.error,'alert'));const groups=new Map();for(const entry of run.entries){if(!groups.has(entry.directory))groups.set(entry.directory,[]);groups.get(entry.directory).push(entry);}for(const [key,all] of groups){const selected=all.filter(matches);if(!selected.length)continue;const group=fold('series:'+run.id+':'+key,true,'series'),heading=node('summary');heading.append(node('strong',all[0].series_title),node('span','完成 '+all.filter(e=>['completed','reused'].includes(e.status)).length+'/'+all.length+' 集 · 失败 '+all.filter(e=>e.status==='failed').length));group.append(heading);const wrap=node('div',undefined,'tablewrap'),table=node('table'),head=node('tr');['剧集 / 实际媒体','状态','下载进度','解析与保存进度','耗时'].forEach(t=>head.append(node('th',t)));table.append(head);selected.sort((a,b)=>a.episode-b.episode);for(const entry of selected){const row=node('tr'),name=node('td','第 '+entry.episode+' 集 · '+entry.title);name.append(node('small',entry.media_label||('视频排名 '+entry.quality_rank+' · 音轨排名 '+entry.audio_quality_rank)));if(entry.detail)name.append(node('small',entry.detail));const detail=fold('entry:'+entry.id,false,'detail');detail.append(node('summary','查看详情'));if(entry.output)detail.append(node('p','成品：'+entry.output));if(entry.error)detail.append(node('p',entry.error));if(entry.file_url){const a=node('a','打开成品');a.href=entry.file_url;a.target='_blank';detail.append(a);}if(entry.report_url){const a=node('a','查看报告');a.href=entry.report_url;a.target='_blank';detail.append(a);}name.append(detail);const status=node('td');status.append(badge(entry.status));const end=entry.finished?new Date(entry.finished):state.closed||!connected?new Date(state.captured_at):new Date();row.append(name,status,meter(entry.download),meter(entry.processing),node('td',entry.started?duration((end-new Date(entry.started))/1000):'—','number'));table.append(row);}wrap.append(table);group.append(wrap);section.append(group);}host.append(section);}if(!host.children.length)host.append(node('p','没有匹配的剧集。','empty'));if(!live)document.getElementById('export').hidden=true;window.scrollTo(0,y);}
/** 获取一次实时状态，终态渲染后确认版本；失败保留最后内容，无返回值。 */
async function refresh(){try{const response=await fetch('/api/state',{cache:'no-store'});if(!response.ok)throw new Error('HTTP '+response.status);state=await response.json();connected=true;render();if(state.closed){await fetch('/api/ack?revision='+encodeURIComponent(state.revision),{cache:'no-store'});return;}}catch(_){connected=false;render();}timer=setTimeout(refresh,interval);}
document.getElementById('search').addEventListener('input',render);document.getElementById('filter').addEventListener('change',render);render();if(live)refresh();
</script></html>
