# 客户端版本目录的父目录；按版本号选取最新目录。
dll_root: 'D:\Program Files\IQIYI Video\LStyle'
# 最新版本目录中的客户端 DLL 文件名。
dll_name: 'mctoplayer.dll'
# 客户端证书文件路径。
cert_path: 'C:\Users\Public\QiYi\drmq_config\cert'
# 以下函数位置基于现有客户端分析；升级后若不兼容，需重新分析并修改。
rva:
  # 分配设备或播放上下文的函数 RVA。
  allocate: 0x10a0
  # 释放上下文的函数 RVA。
  release: 0x1110
  # 设置客户端证书的函数 RVA。
  set_certificate: 0x1450
  # 设置播放授权的函数 RVA。
  set_license: 0x18c0
  # 设置分段处理模式的函数 RVA。
  set_mode: 0x2880
  # 解密媒体数据的函数 RVA。
  decrypt: 0x20c0
  # 当前 SDK 的 CENC 样本参数接口：上下文、IV、子样本数、网络字节序子样本表、表字节数。
  set_cenc_sample: 0x1ea0
# 当前版本原生调用方及实现核对的 CENC 模式；使用票据上下文，不导出票据中的密钥。
cenc_mode: 6
