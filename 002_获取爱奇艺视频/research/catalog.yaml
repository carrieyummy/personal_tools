purpose: 保存 v5 和播放 SDK 调研材料；正式入口为 decode_qsv.py 和 download_iqiyi.py，运行参数从工具根目录 configs/ 中的 YAML 读取，研究专用配置放在 research/configs/。
format_methods: formats.yaml
decode_benchmark:
  script: ../tests/benchmark_decode.py
  config: configs/benchmark_decode.yaml
  main_config: ../configs/config.yaml
  path_base: 本 catalog.yaml 所在目录。
  purpose: 比较已验证 MP4 的 CPU/GPU 完整解码性能；正式工具参数直接读取主配置。
playback_cache_probe:
  script: inspect_playback_cache.py
  config: ../configs/playback.yaml
  purpose: 只读查询链接对应的主 PGF 播放缓存索引；不调用客户端离线下载或修改缓存。
  status: 已验证部分 4K TS 缓存样本；完整媒体获取由下方独立的 playback_session_probe 研究。
playback_session_probe:
  script: probe_playback.py
  config: ../configs/playback.yaml
  purpose: 从已初始化的播放 SDK 按任务 quality 请求清单指定集，不切换可见播放器；可验证短段或完整获取该集。
  status: 已验证一次暂停后三个电视剧的资源解析；内嵌MPD的AV1/CENC、旧HLS与独立最高AAC音轨均已整集解码、发布和重复复用验收，客户端下载记录保持不变。正式入口支持逐剧逐集网页、全剧目录、流式获取、分段断点及验证候选续发，最高视频与音轨分开选档；证据与适配边界见 link_download_findings.md。
movie_probe:
  script: probe_movie.py
  config: ../configs/playback.yaml
  purpose: 核对分享页与电影正片的官方编号关联、时长和院线上映日；可选完整下载并验证音视频，候选留在 report_dir 下。
  status: 《四渡》的短链接、电影直链、院线上映日期及完整授权媒体已完成验证。
  findings: link_download_findings.md
license_probe:
  script: ../tests/probe_native_v5.py
  arguments:
  - --config
  - ../configs/config.yaml
  path_base: 本 catalog.yaml 所在目录；探测脚本复用正式业务模块，不使用历史 JSON 配置。
archive:
  directory: archive
  purpose: 早期 v3/v5 探测配置与旧字节码，仅保留调研记录；不是运行配置。
