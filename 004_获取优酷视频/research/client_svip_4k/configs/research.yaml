# 相对路径以此配置所在目录为基准；环境变量显式展开，禁止新增带空格的研究输出路径。
client_dir: C:/Program Files (x86)/YOUKU/9.5.3.1001
user_data: '%APPDATA%/youku-app'
native_data: '%APPDATA%/youku'
download_list: ../../../download_list/download_list.yaml
sample_title: 难哄
output_dir: ../reports/latest
native:
  executable: YOUKU.exe
  module: youku-player.node
  ccode: '03020102'
  client_ip: 192.168.1.1
  timeout_seconds: 20
network:
  # 使用客户端现有明文 Cookie，值仅留内存；仅允许 youku.com HTTPS，禁用代理。
  base_url: https://acs.youku.com/h5
  app_key: '24679788'
  jsv: '2.7.5'
  data_type: originaljson
  timeout_seconds: 20
  max_response_bytes: 8388608
  token_cookie: _m_h5_tk
  device_cookie: cna
  referer: https://v.youku.com/
  user_agent: Mozilla/5.0 (Windows NT 10.0; Win32; x86) AppleWebKit/537.36 (KHTML, like Gecko) YoukuDesktop/{version}.{buildnumber} Chrome/93.0.4577.82 Electron/14.2.0 Safari/537.36
  member:
    api: mtop.youku.vip.xtop.member.profile.get
    version: '1.0'
    req:
      deviceType: pc
      show: 1
  panel:
    api: mtop.youku.pixiu.downloadpanelattr.get
    version: '1.0'
    payload:
      show_id: ''
      appPackageId: com.youku.iku
      device: pc
    system_info:
      apppackagekey: com.youku.iku
      device: pc
      resource: electron
  ups:
    api: mtop.youku.play.ups.appinfo.get
    version: '1.1'
    ad_params: {}
    cases:
      - name: download_sdk_reference
        # 下载面板取流代码中的参数，app_ver 使用客户端完整版本。
        player_version: null
        base_url: https://acs.youku.com/h5
        biz_params:
          play_ability: 5376
          extag: EXT-X-PRIVINF
          drm_type: 3
          key_index: key01
          master_m3u8: 1
      - name: desktop_playback_sdk
        # 来自缓存播放器 9.22.1：16782592 + 2**31；2**17 + 2**19；ElectronIku.h265=1。
        player_version: '9.22.1'
        base_url: https://un-acs.youku.com/h5
        biz_params: &desktop_playback_params
          play_ability: 2164266240
          close_ability: 655360
          h265: 1
          extag: EXT-X-PRIVINF
          drm_type: 3
          key_index: key01
          master_m3u8: 1
          media_type: standard,subtitle,sei
          wdm: 1
          playMode: normal
          pn: com.youku.iku
      - name: desktop_frame4k_selected
        # 播放器清晰度映射：4k_frame -> 25；只比较真实源码中的档位，不修改账号权益。
        player_version: '9.22.1'
        base_url: https://un-acs.youku.com/h5
        biz_params:
          <<: *desktop_playback_params
          preferClarity: 25
          # HasGetDecryptR1 返回 true 时，播放器使用接口元数据加密版本 1。
          enc_ver: 1
source:
  globs:
    - app/app/main/dist/main.prod.js
    - app/app/preload/download.js
    - app/app/preload/nplayer.js
    - app/app/renderer/dist/rendererv2.prod.js
  cache_globs:
    - local_caches/v2/static/*.js
  terms:
    - mtop.youku.play.ups.appinfo.get
    - mtop.youku.upsplayer.getUps
    - mtop.youku.pixiu.downloadpanelattr.get
    - mtop.youku.pixiu.downloadmix.load
    - getUpsCkey
    - get-ups-ckey
    - get-session-cookies
    - videoSizeHBR4K
    - qualityCodeNeedSvip
    - setDrmInfo
    - encryptR_client
    - drm_type
    - playAbility:16782592
    - t.h265=1
    - biz_params.play_ability
    - '"4k_frame":25'
    - hbr4k_open
    - getDecryptR1
    - biz_params.enc_ver
  context_chars: 260
  matches_per_term: 2
cache:
  # 仅扫描优酷自己的 HTTP 缓存；文件被客户端独占时记录失败，不解锁或关闭客户端。
  roots:
    - '%APPDATA%/youku/cache'
    - '%APPDATA%/youku-app/Cache'
  max_file_bytes: 33554432
  max_total_bytes: 536870912
  max_json_candidates_per_file: 24
  json_markers:
    - '{"data"'
    - '{"ret"'
    - '{"stream"'
    - '{"video"'
  stream_fields:
    - stream_type
    - width
    - height
    - size
    - milliseconds_video
    - milliseconds_audio
    - drm_type
    - media_type
    - audio_lang
    - subtitle_lang
